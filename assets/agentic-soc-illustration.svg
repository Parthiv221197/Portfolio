<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="An AI agent at the center of a network with bright connections to a few known systems and many dim nodes representing the internal context the agent does not yet have">
  <defs>
    <pattern id="agSocGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="rgba(106,110,117,0.10)" stroke-width="1" fill="none"/>
    </pattern>
    <radialGradient id="agSocGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0e7c7b" stop-opacity="0.40"/>
      <stop offset="55%"  stop-color="#0e7c7b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e7c7b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="agSocConn" x1="0" x2="1">
      <stop offset="0%"  stop-color="#0e7c7b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e7c7b" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- Subtle grid background -->
  <rect width="1200" height="540" fill="url(#agSocGrid)"/>

  <!-- Soft glow around the agent -->
  <circle cx="600" cy="270" r="260" fill="url(#agSocGlow)"/>

  <!-- DIM NODES: services, identities, apps the agent doesn't have context on -->
  <g fill="#6a6e75">
    <circle cx="92"   cy="78"  r="4" opacity="0.32"/>
    <circle cx="158"  cy="142" r="5" opacity="0.30"/>
    <circle cx="244"  cy="62"  r="3" opacity="0.28"/>
    <circle cx="312"  cy="118" r="4" opacity="0.34"/>
    <circle cx="396"  cy="58"  r="5" opacity="0.30"/>
    <circle cx="472"  cy="116" r="3" opacity="0.28"/>
    <circle cx="556"  cy="48"  r="4" opacity="0.32"/>
    <circle cx="660"  cy="92"  r="5" opacity="0.32"/>
    <circle cx="748"  cy="42"  r="4" opacity="0.30"/>
    <circle cx="832"  cy="106" r="5" opacity="0.32"/>
    <circle cx="920"  cy="56"  r="4" opacity="0.30"/>
    <circle cx="1010" cy="122" r="5" opacity="0.34"/>
    <circle cx="1100" cy="74"  r="3" opacity="0.28"/>
    <circle cx="78"   cy="226" r="5" opacity="0.32"/>
    <circle cx="194"  cy="276" r="3" opacity="0.30"/>
    <circle cx="248"  cy="356" r="4" opacity="0.32"/>
    <circle cx="166"  cy="430" r="5" opacity="0.34"/>
    <circle cx="282"  cy="486" r="4" opacity="0.30"/>
    <circle cx="380"  cy="446" r="3" opacity="0.28"/>
    <circle cx="470"  cy="498" r="5" opacity="0.32"/>
    <circle cx="568"  cy="468" r="3" opacity="0.30"/>
    <circle cx="690"  cy="494" r="4" opacity="0.32"/>
    <circle cx="784"  cy="450" r="5" opacity="0.34"/>
    <circle cx="884"  cy="488" r="3" opacity="0.28"/>
    <circle cx="990"  cy="450" r="4" opacity="0.30"/>
    <circle cx="1086" cy="496" r="5" opacity="0.32"/>
    <circle cx="1136" cy="380" r="4" opacity="0.32"/>
    <circle cx="1080" cy="268" r="3" opacity="0.30"/>
    <circle cx="1148" cy="200" r="5" opacity="0.34"/>
    <circle cx="1024" cy="338" r="4" opacity="0.30"/>
    <circle cx="60"   cy="356" r="3" opacity="0.28"/>
    <circle cx="32"   cy="468" r="4" opacity="0.32"/>
  </g>

  <!-- KNOWN CONTEXT: a few connections from agent to lit nodes -->
  <g stroke="#0e7c7b" fill="none" stroke-width="1.5" stroke-linecap="round">
    <line x1="600" y1="270" x2="396" y2="186" opacity="0.55"/>
    <line x1="600" y1="270" x2="828" y2="178" opacity="0.55"/>
    <line x1="600" y1="270" x2="450" y2="404" opacity="0.55"/>
    <line x1="600" y1="270" x2="780" y2="402" opacity="0.55"/>
    <line x1="600" y1="270" x2="306" y2="312" opacity="0.45"/>
    <line x1="600" y1="270" x2="900" y2="316" opacity="0.45"/>
  </g>

  <!-- Lit context nodes (with subtle ring) -->
  <g>
    <circle cx="396" cy="186" r="8" fill="#0e7c7b"/>
    <circle cx="396" cy="186" r="14" fill="none" stroke="#0e7c7b" stroke-width="1" opacity="0.35"/>

    <circle cx="828" cy="178" r="8" fill="#0e7c7b"/>
    <circle cx="828" cy="178" r="14" fill="none" stroke="#0e7c7b" stroke-width="1" opacity="0.35"/>

    <circle cx="450" cy="404" r="7" fill="#0e7c7b"/>
    <circle cx="450" cy="404" r="13" fill="none" stroke="#0e7c7b" stroke-width="1" opacity="0.35"/>

    <circle cx="780" cy="402" r="7" fill="#0e7c7b"/>
    <circle cx="780" cy="402" r="13" fill="none" stroke="#0e7c7b" stroke-width="1" opacity="0.35"/>

    <circle cx="306" cy="312" r="6" fill="#0e7c7b"/>
    <circle cx="306" cy="312" r="11" fill="none" stroke="#0e7c7b" stroke-width="1" opacity="0.30"/>

    <circle cx="900" cy="316" r="6" fill="#0e7c7b"/>
    <circle cx="900" cy="316" r="11" fill="none" stroke="#0e7c7b" stroke-width="1" opacity="0.30"/>
  </g>

  <!-- Central agent: pulsing core -->
  <g>
    <circle cx="600" cy="270" r="36" fill="#0e7c7b"/>
    <circle cx="600" cy="270" r="36" fill="none" stroke="#0e7c7b" stroke-width="2" opacity="0.55">
      <animate attributeName="r" values="36;72;36" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="270" r="36" fill="none" stroke="#0e7c7b" stroke-width="1.5" opacity="0.40">
      <animate attributeName="r" values="36;58;36" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.40;0;0.40" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="276" text-anchor="middle"
          font-family="Instrument Serif, Georgia, serif" font-style="italic"
          font-size="18" fill="#fffdf6">agent</text>
  </g>

  <!-- Annotated label: known context -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="1.2"
     fill="#0a5e5d">
    <text x="900" y="350" text-anchor="start">KNOWN CONTEXT</text>
    <line x1="892" y1="346" x2="826" y2="194" stroke="#0e7c7b" stroke-width="0.7" opacity="0.45"/>
  </g>

  <!-- Annotated label: missing context -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="1.2"
     fill="#6a6e75">
    <text x="60" y="500" text-anchor="start">EVERYTHING ELSE</text>
  </g>
</svg>
