name: Deploy to GitHub Pages

# Auto-deploys the site whenever main is updated — push a new blog post,
# tweak copy, change styles, the live site updates within ~1 min.

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy from the Actions tab without a commit.
  workflow_dispatch:

# Required permissions for the official Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. Newer pushes wait, but won't be cancelled —
# we want every commit to actually publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # Sanity check — fail the build if any HTML file is malformed.
      # Catches accidental tag mismatches before they hit the live site.
      - name: Lint HTML
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y libxml2-utils >/dev/null
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            xmllint --html --noout "$f" 2>&1 | grep -E "parser error" \
              | grep -vE "htmlParseEntityRef|Tag (header|nav|main|article|section|figure|figcaption|aside|footer|svg|path|circle|rect|line|polygon|polyline|ellipse|g|defs|use|symbol|filter|feTurbulence|feColorMatrix|feGaussianBlur|feConvolveMatrix|feComponentTransfer|feFuncR|feFuncG|feFuncB|feFuncA|feBlend|feOffset|feComposite|feMerge|feMergeNode|feMorphology|feDisplacementMap|feFlood|feImage|feSpecularLighting|feDiffuseLighting|feDistantLight|fePointLight|feSpotLight|feTile|fecolormatrix|feconvolvematrix|fecomponenttransfer|fefuncr|fefuncg|fefuncb|fefunca|fegaussianblur|feturbulence|feblend|feoffset|fecomposite|femerge|femergenode|femorphology|fedisplacementmap|feflood|feimage|fespecularlighting|fediffuselighting|fedistantlight|fepointlight|fespotlight|fetile|mask|clipPath|linearGradient|radialGradient|stop|text|tspan) invalid" \
              && fail=1 || true
          done < <(find . -name '*.html' -not -path './.git/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "::error::HTML lint found issues"
            exit 1
          fi
          echo "HTML OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site — index.html, styles.css, script.js,
          # blog/, assets/, etc. Anything we don't want shipped goes in .gitignore.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
